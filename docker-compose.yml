services:
  postgres:
    image: postgres:16-alpine
    container_name: tripos-postgres
    environment:
      POSTGRES_USER: tripos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tripos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tripos-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
