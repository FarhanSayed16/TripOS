name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install -U pip
          python -m pip install pytest pytest-asyncio pyjwt pydantic pydantic-settings
      - name: Compile critical modules
        run: |
          python -c "import py_compile; py_compile.compile('app/api/deps.py', doraise=True); print('deps.py OK')"
      - name: Unit tests (no DB)
        run: |
          python -m pytest tests/test_sprint_g_security.py tests/test_sprint_h.py tests/test_sprint_i_payments.py tests/test_adapters_contract.py tests/test_encryption.py tests/test_messaging_provider.py -q
